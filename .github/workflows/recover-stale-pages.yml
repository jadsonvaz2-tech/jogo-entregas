name: Recover stale GitHub Pages deployment
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-stale-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stale Pages deployment
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const staleDeployment = "67c9e1b7815964cfb9b6bc1cda1f1ad68f6a720a";
            const endpoint = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/pages/deployments/${staleDeployment}/cancel`;
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (response.status !== 204) {
              const details = await response.text();
              throw new Error(`GitHub Pages cancellation failed (HTTP ${response.status}): ${details}`);
            }
            core.info(`Successfully requested cancellation of stale Pages deployment ${staleDeployment}.`);
